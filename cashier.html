<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Касса Продавца | NFC Терминал РТ</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .pos-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .pos-key {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s;
    }
    .pos-key:active {
      background: rgba(0, 210, 255, 0.3);
      transform: scale(0.96);
    }
    .pos-key.del { color: #f87171; }
    .pos-key.clear { color: #fbbf24; }
    .btn-charge {
      width: 100%;
      background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
      color: #051329;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 18px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 210, 255, 0.35);
      transition: transform 0.1s;
    }
    .btn-charge:active {
      transform: scale(0.98);
    }
    .qr-frame {
      background: #ffffff;
      padding: 16px;
      border-radius: 18px;
      display: inline-block;
      margin: 16px auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .qr-img {
      width: 220px;
      height: 220px;
      display: block;
      border-radius: 8px;
    }
    .btn-open-link {
      display: block;
      margin-top: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #38bdf8;
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 600;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <!-- 1. Экран ввода суммы продавцом -->
  <div class="payment-container" id="keypadView">
    <div class="badge-nfc">
      <span>🏪</span> Касса Продавца
    </div>

    <div class="merchant-title">Получатель: +992 92 882 6696</div>
    <div style="font-size: 0.82rem; color: #94a3b8; margin-bottom: 12px;">Введите сумму покупки:</div>

    <div class="amount-box">
      <div class="amount-label">К получению</div>
      <div class="amount-value" id="enteredAmount">0.00 TJS</div>
    </div>

    <div class="pos-keypad">
      <button type="button" class="pos-key" onclick="pressDigit('1')">1</button>
      <button type="button" class="pos-key" onclick="pressDigit('2')">2</button>
      <button type="button" class="pos-key" onclick="pressDigit('3')">3</button>
      <button type="button" class="pos-key" onclick="pressDigit('4')">4</button>
      <button type="button" class="pos-key" onclick="pressDigit('5')">5</button>
      <button type="button" class="pos-key" onclick="pressDigit('6')">6</button>
      <button type="button" class="pos-key" onclick="pressDigit('7')">7</button>
      <button type="button" class="pos-key" onclick="pressDigit('8')">8</button>
      <button type="button" class="pos-key" onclick="pressDigit('9')">9</button>
      <button type="button" class="pos-key clear" onclick="clearInput()">C</button>
      <button type="button" class="pos-key" onclick="pressDigit('0')">0</button>
      <button type="button" class="pos-key del" onclick="backspace()">⌫</button>
    </div>

    <button type="button" class="btn-charge" id="btnCharge" onclick="chargeOrder()">
      ВЫСТАВИТЬ СЧЕТ (NFC / QR)
    </button>
  </div>

  <!-- 2. Экран ожидания оплаты покупателем -->
  <div class="payment-container" id="waitingView" style="display: none;">
    <div class="badge-nfc">
      <span>📡</span> Приложите телефон или отсканируйте
    </div>

    <div class="amount-value" id="waitingAmount" style="margin: 8px 0; font-size: 2.5rem;">50.00 TJS</div>
    <div style="font-size: 0.85rem; color: #94a3b8;" id="waitingOrderText">Заказ #ORD-123456</div>

    <div class="qr-frame">
      <img id="qrImage" class="qr-img" src="" alt="QR-код оплаты">
    </div>

    <p style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 8px;">
      Покупатель наводит камеру смартфона или касается вашей NFC-метки.
    </p>

    <a id="payDirectLink" href="#" target="_blank" class="btn-open-link">
      🔗 Открыть страницу оплаты вручную
    </a>

    <div style="margin-top: 16px;">
      <button type="button" class="btn-simulate" onclick="cancelCharge()" style="background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #f87171;">
        ✕ Отменить / Новый чек
      </button>
    </div>
  </div>

  <script>
    let currentInput = "0";

    function pressDigit(d) {
      if (currentInput === "0") currentInput = d;
      else if (currentInput.length < 6) currentInput += d;
      updateDisplay();
    }

    function clearInput() {
      currentInput = "0";
      updateDisplay();
    }

    function backspace() {
      if (currentInput.length > 1) currentInput = currentInput.slice(0, -1);
      else currentInput = "0";
      updateDisplay();
    }

    function updateDisplay() {
      const num = parseFloat(currentInput) || 0;
      document.getElementById('enteredAmount').textContent = num.toFixed(2) + " TJS";
    }

    function chargeOrder() {
      const num = parseFloat(currentInput);
      if (!num || num <= 0) {
        alert("Пожалуйста, сначала введите сумму на клавиатуре (например: 10)");
        return;
      }

      const orderId = "ORD-" + Math.floor(100000 + Math.random() * 900000);
      
      // Формируем чистую ссылку на index.html
      const currentUrl = window.location.href.split('?')[0].split('#')[0];
      const baseUrl = currentUrl.endsWith('cashier.html')
        ? currentUrl.replace('cashier.html', 'index.html')
        : currentUrl.replace(/\/$/, '') + '/index.html';

      const customerPayUrl = `${baseUrl}?order=${orderId}&amount=${num}`;

      document.getElementById('waitingAmount').textContent = num.toFixed(2) + " TJS";
      document.getElementById('waitingOrderText').textContent = "Заказ #" + orderId;

      // 100% надежный QR-код без сторонних JS скриптов
      const qrApiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=2&data=" + encodeURIComponent(customerPayUrl);
      document.getElementById('qrImage').src = qrApiUrl;

      // Прямая ссылка
      const linkEl = document.getElementById('payDirectLink');
      linkEl.href = customerPayUrl;
      linkEl.textContent = "🔗 Перейти к оплате: " + num + " TJS";

      // Переключаем экраны
      document.getElementById('keypadView').style.display = "none";
      document.getElementById('waitingView').style.display = "block";
    }

    function cancelCharge() {
      currentInput = "0";
      updateDisplay();
      document.getElementById('waitingView').style.display = "none";
      document.getElementById('keypadView').style.display = "block";
    }
  </script>
</body>
</html>
